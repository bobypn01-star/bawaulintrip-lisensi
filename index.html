<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#111111"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>Admin bawaulin.trip</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111;color:#fff7ed;font:15px sans-serif;padding-bottom:70px}.top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#1c1917;font-weight:bold;color:#fbbf24;position:sticky;top:0}.body{padding:12px 14px;max-width:560px;margin:auto}.msg{padding:0 14px;color:#fbbf24;font-size:13px;min-height:4px}
input,textarea,button,select{width:100%;padding:12px;margin:5px 0;font-size:16px;border-radius:10px;border:1px solid #444;background:#222;color:#fff}button{background:#f97316;border:0;font-weight:bold}button.s{background:#333;width:auto;padding:8px 12px}.body button.s{width:100%}.top button.s{margin:0}button.r{background:#b91c1c}
.c{background:#1c1917;border-radius:12px;padding:10px 12px;margin:8px 0}.m{color:#a8a29e;font-size:13px;margin-top:3px;word-break:break-word}label{font-size:13px;color:#a8a29e}h3{margin:10px 0}.w{background:#4a1d1d;padding:10px;border-radius:10px;font-size:13px}
.b{font-size:11px;padding:2px 8px;border-radius:99px;background:#444}.AKTIF,.ADMIN_UBAH,.ADMIN_CFG{background:#166534}.BELUM{background:#a16207}.DICABUT,.DOBEL,.DICABUT_COBA,.ADMIN_GAGAL{background:#b91c1c}.LAMA{background:#1d4ed8}.HASH_ASING,.ORIGIN_ASING,.BANJIR,.BANJIR_ID{background:#9a3412}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#1c1917}nav button{background:none;border-radius:0;margin:0;color:#a8a29e;font-size:13px}nav button.on{color:#fbbf24;border-top:2px solid #f97316}.f{display:flex;gap:6px}.f button{padding:8px;font-size:13px;background:#333}.f button.on{background:#f97316}</style></head><body><div id="app"></div><script>
//CRYPTO
const te=new TextEncoder(),td=new TextDecoder();
const b64=u=>btoa(String.fromCharCode(...u)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
async function kdf(pw,salt){const m=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(obj,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await kdf(pw,salt);const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,te.encode(JSON.stringify(obj))));return JSON.stringify({v:1,s:b64(salt),i:b64(iv),c:b64(ct)})}
async function dec(txt,pw){const o=JSON.parse(txt),k=await kdf(pw,unb64(o.s));return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.i)},k,unb64(o.c))))}
async function genKey(){const kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);const priv=await crypto.subtle.exportKey('jwk',kp.privateKey),p=await crypto.subtle.exportKey('jwk',kp.publicKey);return{priv,pub:{kty:p.kty,crv:p.crv,x:p.x,y:p.y}}}
async function sign(priv,id){const k=await crypto.subtle.importKey('jwk',priv,{name:'ECDSA',namedCurve:'P-256'},false,['sign']);return b64(new Uint8Array(await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},k,te.encode('bawaulin|'+id))))}
//ENDCRYPTO
const $=s=>document.querySelector(s),VK='adm_vault',DEFURL='https://script.google.com/macros/s/AKfycbwheQyfz4A1jwJbOTAshlXRgDneXE1X4QD3wo91gDonVd0x1W4QnnSmUWx2c5Qowvk9/exec';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short=t=>t?String(t).slice(0,16).replace('T',' '):'-';
let S={v:null,pw:'',tab:'dev',list:[],ev:[],cfg:{},sel:null,q:'',f:'ALL',msg:'',key:'',bak:''},lockT;
function touch(){clearTimeout(lockT);if(S.v)lockT=setTimeout(()=>location.reload(),300000)}
addEventListener('click',touch);addEventListener('input',touch);
function say(m){S.msg=m;const e=$('#msg');if(e)e.textContent=m}
const ET={belum:'Rahasia admin belum dipasang di server',salah:'Rahasia admin salah',terkunci:'Terkunci 15 menit (salah 5 kali)',format:'Format kode salah',aksi:'Aksi tidak dikenal',sibuk:'Server sibuk, ulangi'};
const errT=e=>ET[e]||('Gagal: '+((e&&e.message)||e));
async function api(a,x){try{const r=await fetch(S.v.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({a,s:S.v.sec},x||{}))});return await r.json()}catch(e){return{ok:0,err:e}}}
async function saveV(){localStorage.setItem(VK,await enc(S.v,S.pw))}
const setupH=()=>`<div class="body"><h3>Pasang aplikasi admin</h3><div class="w">Kunci privat dibuat di HP ini dan disimpan terenkripsi. Tidak pernah dikirim ke server. Simpan kata sandi di pengelola kata sandi.</div><label>URL server lisensi</label><input id="u" value="${DEFURL}"><label>Rahasia admin (dari Execution log)</label><input id="sc" type="password"><label>Kata sandi aplikasi (min. 12 karakter)</label><input id="p1" type="password"><input id="p2" type="password" placeholder="Ulangi kata sandi"><button onclick="doSetup()">Buat kunci dan mulai</button><div id="msg" class="msg"></div><label>Atau pulihkan dari cadangan</label><textarea id="imp" rows="3"></textarea><button class="s" onclick="imp()">Impor cadangan</button></div>`;
const lockH=()=>`<div class="body"><h3>Admin bawaulin.trip</h3><input id="p" type="password" placeholder="Kata sandi" onkeydown="if(event.key=='Enter')unlock()"><button onclick="unlock()">Buka</button><div id="msg" class="msg"></div></div>`;
async function doSetup(){const url=$('#u').value.trim(),sec=$('#sc').value.trim(),p=$('#p1').value;
 if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url))return say('URL server tidak valid');
 if(sec.length<16)return say('Rahasia admin terlalu pendek');
 if(p.length<12||p!==$('#p2').value)return say('Kata sandi min. 12 karakter dan harus sama');
 say('Membuat kunci...');const k=await genKey();S.v={priv:k.priv,pub:k.pub,url,sec};S.pw=p;await saveV();S.tab='key';render();touch();load()}
async function unlock(){const p=$('#p').value;say('Membuka...');try{S.v=await dec(localStorage.getItem(VK),p);S.pw=p}catch(e){return say('Kata sandi salah')}S.tab='dev';touch();render();load()}
async function imp(){const t=$('#imp').value.trim(),p=prompt('Kata sandi cadangan');if(!t||!p)return;try{S.v=await dec(t,p);S.pw=p;await saveV();touch();render();load()}catch(e){say('Gagal: cadangan atau kata sandi salah')}}
const cfgMap=c=>Array.isArray(c)?Object.fromEntries(c.map(r=>[r.kunci,r.nilai])):(c||{});
async function load(){say('Memuat...');const r=await api('adm_list');if(r.ok){S.list=r.perangkat||[];S.ev=r.kejadian||[];S.cfg=cfgMap(r.config);say('')}else say(errT(r.err));render()}
function go(t){S.tab=t;S.sel=null;S.key='';render()}
const warn=d=>Number(d.jml_dobel)>0||S.ev.some(e=>e.kode==d.kode&&!/^ADMIN/.test(e.jenis));
function listH(){const q=S.q.toLowerCase(),L=S.list.filter(d=>(S.f=='ALL'||d.status==S.f)&&(!q||[d.kode,d.pembeli,d.wa,d.catatan].join(' ').toLowerCase().includes(q)));
 return L.length?L.map(d=>`<div class="c" onclick="pick('${esc(d.kode)}')"><b>${esc(d.kode)}</b> <span class="b ${esc(d.status)}">${esc(d.status)}</span>${warn(d)?' ⚠':''}<div class="m">${esc(d.pembeli||'(tanpa nama)')} · ${esc(d.versi||'-')} · cek ${esc(short(d.terakhir_cek))}</div></div>`).join(''):'<p class="m">Tidak ada perangkat.</p>'}
const devH=()=>`<input placeholder="Cari kode / nama / WA" value="${esc(S.q)}" oninput="S.q=this.value;$('#lst').innerHTML=listH()"><div class="f">${['ALL','BELUM','AKTIF','DICABUT'].map(f=>`<button class="${S.f==f?'on':''}" onclick="S.f='${f}';render()">${f=='ALL'?'Semua':f}</button>`).join('')}</div><div class="m">${S.list.length} perangkat</div><div id="lst">${listH()}</div><button class="s" onclick="addDev()">+ Tambah kode manual</button><button class="s" onclick="load()">Muat ulang</button>`;
function pick(k){S.sel=k;S.key='';render()}
function detH(){const d=S.list.find(x=>x.kode==S.sel)||{kode:S.sel};return `<button class="s" onclick="S.sel=null;S.key='';render()">‹ Kembali</button><h3>${esc(d.kode)} <span class="b ${esc(d.status)}">${esc(d.status||'')}</span></h3><div class="m">Aktif: ${esc(short(d.tgl_aktif))} · Cek terakhir: ${esc(short(d.terakhir_cek))} · Versi ${esc(d.versi||'-')}<br>Asal: ${esc(d.asal||'-')} · Dobel: ${esc(d.jml_dobel||0)}</div><label>Pembeli</label><input id="fp" value="${esc(d.pembeli)}"><label>WhatsApp</label><input id="fw" inputmode="tel" value="${esc(d.wa)}"><label>Catatan</label><textarea id="fc" rows="2">${esc(d.catatan)}</textarea><button onclick="terbit()">Terbitkan kunci + Aktifkan</button><button class="s" onclick="setSt()">Simpan data saja</button><button class="s" onclick="setSt('AKTIF')">Aktifkan lagi</button><button class="r" onclick="cabut()">Cabut</button>${S.key?`<label>Kunci aktivasi (kirim ke pembeli)</label><textarea id="ko" rows="3" readonly>${esc(S.key)}</textarea><button onclick="salin('ko')">Salin kunci</button><button class="s" onclick="wa()">Kirim lewat WhatsApp</button>`:''}`}
async function setSt(st){const x={id:S.sel,pembeli:$('#fp').value,wa:$('#fw').value,catatan:$('#fc').value};if(st)x.st=st;say('Menyimpan...');const r=await api('adm_set',x);if(!r.ok){say(errT(r.err));return false}await load();say('Tersimpan');return true}
async function terbit(){if(!confirm('Terbitkan kunci dan aktifkan '+S.sel+'?'))return;const sig=await sign(S.v.priv,S.sel);if(await setSt('AKTIF')){S.key=sig;try{navigator.clipboard.writeText(sig).catch(()=>{})}catch(e){}render();say('Aktif. Kunci tersalin.')}}
function cabut(){if(confirm('Cabut lisensi '+S.sel+'?'))setSt('DICABUT')}
function salin(id){const o=$('#'+id);o.select();try{navigator.clipboard.writeText(o.value).catch(()=>document.execCommand('copy'))}catch(e){document.execCommand('copy')}say('Tersalin')}
function wa(){const n=($('#fw').value||'').replace(/\D/g,'').replace(/^0/,'62');open('https://wa.me/'+n+'?text='+encodeURIComponent('Kunci aktivasi bawaulin.trip Anda:\n'+S.key))}
async function addDev(){const id=(prompt('Kode perangkat (BU-XXXX-XXXX)')||'').toUpperCase().trim();if(!id)return;if(!/^BU-[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$/.test(id))return say('Format kode salah');const r=await api('adm_set',{id});if(!r.ok)return say(errT(r.err));await load();pick(id)}
const evH=()=>S.ev.length?S.ev.map(e=>`<div class="c"><span class="b ${esc(e.jenis)}">${esc(e.jenis)}</span> ${esc(e.kode)}<div class="m">${esc(short(e.waktu))} · ${esc(e.detail)}</div></div>`).join(''):'<p class="m">Belum ada kejadian.</p>';
const CK=[['vmin','Versi minimum (mis. v21)'],['tol_hari','Toleransi offline (hari)'],['migrasi_sampai','Migrasi sampai (YYYY-MM-DD)'],['hash_sah','Hash kode sah'],['origin_sah','Asal alamat sah (pisah koma)'],['baru_harian_maks','Maks. kode baru per hari'],['cek_harian_maks','Maks. cek per hari']];
const srvH=()=>CK.map(([k,l])=>`<label>${l}</label><input id="c_${k}" value="${esc(S.cfg[k])}"><button class="s" onclick="saveCfg('${k}')">Simpan</button>`).join('')+`<h3>Koneksi</h3><label>URL server</label><input id="cu" value="${esc(S.v.url)}"><label>Rahasia admin (kosong = tidak diubah)</label><input id="cs" type="password"><button class="s" onclick="saveConn()">Simpan koneksi</button><button class="s" onclick="ping()">Tes koneksi</button>`;
async function saveCfg(k){const r=await api('adm_cfg',{k,v:$('#c_'+k).value.trim()});if(!r.ok)return say(errT(r.err));S.cfg[k]=$('#c_'+k).value.trim();say('Tersimpan: '+k)}
async function saveConn(){const u=$('#cu').value.trim(),s=$('#cs').value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(u))return say('URL tidak valid');S.v.url=u;if(s)S.v.sec=s;await saveV();say('Koneksi disimpan')}
async function ping(){const r=await api('adm_ping');say(r.ok?'Server dan rahasia OK':errT(r.err))}
const keyH=()=>`<div class="w">Pasang kunci publik ini sebagai LIC_PUB di index.html aplikasi konsumen. Simpan maksimal 2 salinan: aplikasi ini dan satu cadangan terenkripsi di tempat pribadi (bukan GitHub, bukan grup WA). Kata sandi dan cadangan disimpan terpisah.</div><label>Kunci publik (LIC_PUB)</label><textarea id="pub" rows="4" readonly>${esc(JSON.stringify(S.v.pub))}</textarea><button onclick="salin('pub')">Salin kunci publik</button><button class="s" onclick="bak()">Ekspor cadangan terenkripsi</button>${S.bak?`<textarea id="bk" rows="4" readonly>${esc(S.bak)}</textarea><button onclick="salin('bk')">Salin cadangan</button>`:''}<label>Pulihkan dari cadangan</label><textarea id="imp" rows="3"></textarea><button class="s" onclick="imp()">Impor cadangan</button><button class="r" onclick="newKey()">Buat kunci baru</button>`;
async function bak(){S.bak=await enc(S.v,S.pw);render()}
async function newKey(){if(!confirm('Kunci baru membuat SEMUA kunci aktivasi lama tidak sah. Lanjut?')||!confirm('Yakin? Pasang kunci publik baru di aplikasi konsumen.'))return;const k=await genKey();S.v.priv=k.priv;S.v.pub=k.pub;S.bak='';await saveV();render();say('Kunci baru dibuat. Simpan cadangan baru.')}
function render(){const a=$('#app');if(!S.v){a.innerHTML=localStorage.getItem(VK)?lockH():setupH();say(S.msg);return}
 const T=[['dev','Perangkat'],['ev','Kejadian'],['srv','Server'],['key','Kunci']];
 a.innerHTML=`<div class="top">Admin bawaulin.trip <button class="s" onclick="location.reload()">Kunci</button></div><div id="msg" class="msg">${esc(S.msg)}</div><div class="body">${S.tab=='dev'?(S.sel?detH():devH()):S.tab=='ev'?evH():S.tab=='srv'?srvH():keyH()}</div><nav>${T.map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</nav>`}
render();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
