//CRYPTO
const te=new TextEncoder(),td=new TextDecoder();
const b64=u=>btoa(String.fromCharCode(...u)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
async function kdf(pw,salt){const m=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(obj,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await kdf(pw,salt);const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,te.encode(JSON.stringify(obj))));return JSON.stringify({v:1,s:b64(salt),i:b64(iv),c:b64(ct)})}
async function dec(txt,pw){const o=JSON.parse(txt),k=await kdf(pw,unb64(o.s));return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.i)},k,unb64(o.c))))}
async function genKey(){const kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);const priv=await crypto.subtle.exportKey('jwk',kp.privateKey),p=await crypto.subtle.exportKey('jwk',kp.publicKey);return{priv,pub:{kty:p.kty,crv:p.crv,x:p.x,y:p.y}}}
async function sign(priv,id){const k=await crypto.subtle.importKey('jwk',priv,{name:'ECDSA',namedCurve:'P-256'},false,['sign']);return b64(new Uint8Array(await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},k,te.encode('bawaulin|'+id))))}
//ENDCRYPTO
const $=s=>document.querySelector(s),VK='adm_vault',DEFURL='https://eqrubezljxejfnjgqigb.supabase.co/functions/v1/hyper-action';
const ADM_V='v1.7';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short=t=>t?String(t).slice(0,16).replace('T',' '):'-';
/* v1.6: paket Rintis/Puncak dan fase masa coba. Dihitung di sini hanya untuk tampilan; aplikasi konsumen menghitung sendiri dari jam server. */
const hariCfg=(k,def)=>{const n=parseInt((S.cfg||{})[k]);return n>0?n:def};
function fase(d){const pk=d.paket==='pro'?'pro':'gratis';if(pk==='pro')return{pk,nama:'Puncak',ket:'Semua fitur, tanpa batas'};
 const t0=Date.parse(String(d.mulai_t||'').replace(' ','T'));if(!d.mulai_t||isNaN(t0))return{pk,nama:'Rintis',ket:'Masa coba belum mulai (menunggu status Aktif)'};
 const lt=hariCfg('latihan_hari',7),tr=hariCfg('trip_hari',60),now=Date.now(),a=t0+lt*864e5,b=a+tr*864e5,sel=d.sel_t?Date.parse(String(d.sel_t).replace(' ','T')):0;
 if(now<a)return{pk,nama:'Rintis',ket:'Latihan, sisa '+Math.max(1,Math.ceil((a-now)/864e5))+' hari'};
 if(!sel&&now<b)return{pk,nama:'Rintis',ket:'Trip pertama, sisa '+Math.max(1,Math.ceil((b-now)/864e5))+' hari'};
 return{pk,nama:'Rintis',ket:sel?'Trip pertama sudah selesai (fitur Puncak terkunci)':'Masa trip pertama habis (fitur Puncak terkunci)'}}
const pkPill=d=>{const f=fase(d);return `<span class="pill ${f.pk==='pro'?'t-ok':'t-in'}">${f.nama}</span>`};
let S={v:null,pw:'',kel:'',tab:'ring',list:[],ev:[],cfg:{},sel:null,q:'',f:'ALL',msg:'',key:'',bak:''},lockT;
function touch(){clearTimeout(lockT);if(S.v)lockT=setTimeout(()=>location.reload(),300000)}
addEventListener('click',touch);addEventListener('input',touch);
function say(m){S.msg=m;const e=$('#msg');if(e)e.textContent=m}
const ET={belum:'Rahasia admin belum dipasang di server',salah:'Rahasia admin salah',terkunci:'Terkunci 15 menit (salah 5 kali)',format:'Format kode salah',aksi:'Aksi tidak dikenal',sibuk:'Server sibuk, ulangi'};
const errT=e=>ET[e]||('Gagal: '+((e&&e.message)||e));
async function api(a,x){try{const r=await fetch(S.v.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({a,s:S.v.sec},x||{}))});return await r.json()}catch(e){return{ok:0,err:e}}}
async function saveV(){localStorage.setItem(VK,await enc(S.v,S.pw))}
async function doSetup(){const url=$('#u').value.trim(),sec=$('#sc').value.trim(),p=$('#p1').value;
 if(!/^https:\/\/(script\.google\.com\/macros\/s\/.+\/exec|[a-z0-9]+\.supabase\.co\/functions\/v1\/[a-z0-9_-]+)$/.test(url))return say('URL server tidak valid');
 if(sec.length<16)return say('Rahasia admin terlalu pendek');
 if(p.length<12||p!==$('#p2').value)return say('Kata sandi min. 12 karakter dan harus sama');
 say('Membuat kunci...');const k=await genKey();S.v={priv:k.priv,pub:k.pub,url,sec};S.pw=p;await saveV();S.tab='key';render();touch();load()}
async function unlock(){const p=$('#p').value;const r0=$('#er');if(r0)r0.textContent='';say('Membuka...');try{S.v=await dec(localStorage.getItem(VK),p);S.pw=p}catch(e){const c=$('#lkc');if(c){c.classList.remove('sh');void c.offsetWidth;c.classList.add('sh')}const r=$('#er');if(r)r.textContent='Kata sandi salah. Coba lagi.';return say('')}S.tab='ring';touch();render();load()}
async function imp(){const t=$('#imp').value.trim(),p=prompt('Kata sandi cadangan');if(!t||!p)return;try{S.v=await dec(t,p);S.pw=p;await saveV();touch();render();load()}catch(e){say('Gagal: cadangan atau kata sandi salah')}}
const cfgMap=c=>Array.isArray(c)?Object.fromEntries(c.map(r=>[r.kunci,r.nilai])):(c||{});
async function load(){say('Memuat...');const r=await api('adm_list');if(r.ok){S.list=r.perangkat||[];S.ev=r.kejadian||[];S.cfg=cfgMap(r.config);say('')}else say(errT(r.err));render()}
function go(t){S.tab=t;S.sel=null;S.key='';S.kel='';render()}
/* v1.4: Ringkasan dan daftar tindak lanjut. Dihitung dari daftar perangkat yang sudah dimuat, tanpa permintaan tambahan ke server. */
const DAY=864e5;
const tms=t=>{if(t==null||t==='')return NaN;if(typeof t=='number')return t;const x=String(t).trim();if(/^\d{12,13}$/.test(x))return+x;return Date.parse(x.replace(' ','T'))};
const wkey=d=>String(d.wa||'').replace(/\D/g,'').replace(/^0/,'62');
function goF(f){S.f=f;S.q='';S.kel='';S.tab='dev';S.sel=null;S.key='';render()}
function pickD(k){S.tab='dev';S.f='ALL';S.q='';S.kel='';pick(k)}
let GRP=[];
function cariG(i){S.tab='dev';S.sel=null;S.f='ALL';S.q='';S.kel=GRP[i];render()}
const kelKey=d=>wkey(d)||String(d.pembeli||'').trim().toLowerCase();
function waBantu(k){const d=S.list.find(x=>x.kode==k);if(!d||!wkey(d))return;open('https://wa.me/'+wkey(d)+'?text='+encodeURIComponent('Halo, aplikasi bawaulin.trip dengan kode perangkat '+k+' belum diaktifkan. Ada yang bisa kami bantu?'))}
function ringData(){const L=S.list,now=Date.now(),c={AKTIF:0,BELUM:0,DICABUT:0};L.forEach(d=>{if(c[d.status]!=null)c[d.status]++});
 const bl=[];for(let i=5;i>=0;i--){const x=new Date();x.setDate(1);x.setMonth(x.getMonth()-i);bl.push({k:x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'),l:x.toLocaleString('id-ID',{month:'short'}),n:0})}
 L.forEach(d=>{if(d.status!='AKTIF'&&d.status!='LAMA')return;const m=tms(d.tgl_aktif);if(isNaN(m))return;const x=new Date(m),b=bl.find(y=>y.k==x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'));if(b)b.n++});
 const belum=L.filter(d=>d.status=='BELUM'&&now-tms(d.pertama||d.terakhir_cek)>3*DAY);
 const diam=L.filter(d=>d.status=='AKTIF'&&now-tms(d.terakhir_cek)>30*DAY);
 const g={};L.forEach(d=>{const k=wkey(d)||String(d.pembeli||'').trim().toLowerCase();if(k)(g[k]=g[k]||[]).push(d)});
 const ulang=Object.entries(g).filter(([k,a])=>a.length>=2);GRP=ulang.map(x=>x[0]);
 return{c,bl,belum,diam,ulang,warn:L.filter(warn).length}}
const rowD=(d,sub,extra)=>`<div class="c" onclick="pickD('${esc(d.kode)}')"><span class="dot ${esc(d.status)}"></span><div class="tx"><b>${esc(d.kode)}</b><div class="m">${esc(d.pembeli||'Belum ada nama')}</div><div class="m">${sub}</div></div>${extra||''}<span class="chev">›</span></div>`;
function ringH(){if(!S.list.length)return`<div class="empty"><b>Belum ada perangkat</b>Ringkasan muncul setelah ada perangkat yang terdaftar di server.</div>`;
 const r=ringData(),mx=Math.max(1,...r.bl.map(b=>b.n)),dys=t=>{const m=tms(t);return isNaN(m)?'-':Math.floor((Date.now()-m)/DAY)+' hari'};
 const todo=[];
 if(r.belum.length)todo.push(`<h2>Belum diaktifkan lebih dari 3 hari (${r.belum.length})</h2>`+r.belum.map(d=>rowD(d,'Muncul '+dys(d.pertama||d.terakhir_cek)+' lalu',wkey(d)?`<button class="chip" onclick="event.stopPropagation();waBantu('${esc(d.kode)}')">WA</button>`:'')).join(''));
 if(r.diam.length)todo.push(`<h2>Lama tidak dibuka, lebih dari 30 hari (${r.diam.length})</h2>`+r.diam.map(d=>rowD(d,'Online terakhir '+dys(d.terakhir_cek)+' lalu')).join(''));
 if(r.ulang.length)todo.push(`<h2>Satu pembeli, beberapa kode (${r.ulang.length})</h2><div class="hint" style="margin:-4px 2px 8px">Tanda aktivasi ulang atau pembagian kunci. Dikelompokkan dari nomor WhatsApp, atau nama bila nomor kosong.</div>`+r.ulang.map(([k,a],i)=>`<div class="c" onclick="cariG(${i})"><span class="dot"></span><div class="tx"><b>${esc(a[0].pembeli||a[0].wa)}</b><div class="m">${a.length} kode: ${esc(a.map(x=>x.kode).join(', '))}</div></div><span class="chev">›</span></div>`).join(''));
 return`<div class="tiles"><button class="tile AKTIF" onclick="goF('AKTIF')"><b>${r.c.AKTIF}</b><span>Aktif</span></button><button class="tile BELUM" onclick="goF('BELUM')"><b>${r.c.BELUM}</b><span>Belum aktif</span></button><button class="tile DICABUT" onclick="goF('DICABUT')"><b>${r.c.DICABUT}</b><span>Dicabut</span></button><button class="tile WARN" onclick="goF('WARN')"><b>${r.warn}</b><span>Perlu dicek</span></button></div>
